name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm lint

      # The uptime monitor can only catch "pin moved, container never
      # redeployed" while its expectVersion equals the pin. Nothing at runtime
      # can check that for us — the Worker cannot read the Dockerfile — so the
      # two declarations are held together here instead.
      - name: demo image pin matches uptime expectVersion
        run: |
          pin=$(grep -oE 'ghcr\.io/fold-run/fold:v[0-9]+\.[0-9]+\.[0-9]+' apps/demo/Dockerfile | cut -d: -f2)
          expect=$(grep -oE "expectVersion: 'v[0-9]+\.[0-9]+\.[0-9]+'" apps/uptime/src/index.ts | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          echo "Dockerfile pin: '$pin' · uptime expectVersion: '$expect'"
          if [ -z "$pin" ] || [ -z "$expect" ]; then
            echo "::error::could not read one of the two version declarations"
            exit 1
          fi
          if [ "$pin" != "$expect" ]; then
            echo "::error::apps/demo/Dockerfile pins $pin but apps/uptime expects $expect — bump expectVersion to $pin"
            exit 1
          fi
