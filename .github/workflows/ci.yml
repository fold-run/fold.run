name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm lint

      # The uptime monitor can only catch "pin moved, container never
      # redeployed" while its expectVersion equals the pin. Nothing at runtime
      # can check that for us — the Worker cannot read the Dockerfile — so the
      # two declarations are held together here instead.
      # Every gateway runs the same release, so the check is that all of these
      # declarations collapse to one value: the fold pin in each container
      # app's Dockerfile, and every expectVersion in the monitor. Comparing
      # them pairwise would need a TypeScript parser in bash; collapsing them
      # needs sort -u, and it enforces the stronger rule anyway.
      - name: image pins match uptime expectVersion
        run: |
          pins=$(grep -hoE 'ghcr\.io/fold-run/fold:v[0-9]+\.[0-9]+\.[0-9]+' apps/*/Dockerfile | cut -d: -f2 | sort -u)
          expects=$(grep -oE "expectVersion: 'v[0-9]+\.[0-9]+\.[0-9]+'" apps/uptime/src/index.ts | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          echo "Dockerfile pins: $(echo $pins) · uptime expectVersion: $(echo $expects)"
          if [ -z "$pins" ] || [ -z "$expects" ]; then
            echo "::error::could not read one of the version declarations"
            exit 1
          fi
          if [ "$(echo "$pins" | wc -l)" -ne 1 ]; then
            echo "::error::container apps pin different fold releases ($(echo $pins)) — they deploy as one federation and must run one build"
            exit 1
          fi
          if [ "$(echo "$expects" | wc -l)" -ne 1 ]; then
            echo "::error::apps/uptime expects different versions per target ($(echo $expects))"
            exit 1
          fi
          if [ "$pins" != "$expects" ]; then
            echo "::error::Dockerfiles pin $pins but apps/uptime expects $expects — bump expectVersion to $pins"
            exit 1
          fi
