# Manual deploys only — `pnpm --filter @fold-run/<app> deploy` from a laptop is
# the primary path; this workflow is the same thing from the Actions tab.
# Requires repo secrets CLOUDFLARE_API_TOKEN (zone-scoped for fold.run) and
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy ("all" = site/docs/uptime; container apps deploy only by name)
        type: choice
        options: [all, site, docs, uptime, demo, demo-tasks]
        default: all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          app="${{ inputs.app }}"
          for target in site docs uptime; do
            if [ "$app" = "all" ] || [ "$app" = "$target" ]; then
              pnpm --filter "@fold-run/$target" run deploy
            fi
          done
          # The container apps are deliberately NOT in "all": a deploy rolls
          # the container, restarting the public demo gateway and clearing
          # demo-tasks' in-memory job board. Deploy them by name, on purpose.
          # (wrangler builds their Dockerfiles; ubuntu runners ship Docker.)
          for target in demo demo-tasks; do
            if [ "$app" = "$target" ]; then
              pnpm --filter "@fold-run/$target" run deploy
            fi
          done
